<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115 樹人衝刺班出席系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="assets/schedule-web-20260703.webp" type="image/webp" fetchpriority="high">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .status-button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px rgba(15, 23, 42, 0.26); }
    .calendar-day { min-height: 104px; }
    .calendar-card-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .mobile-calendar-day { min-height: 54px; }
    @media (max-width: 640px) {
      .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <header class="bg-slate-950 text-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 px-3 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-4 sm:py-5">
      <button id="homeBrand" class="flex items-center gap-3 text-left transition hover:opacity-90" type="button">
        <div class="flex h-11 w-11 items-center justify-center rounded-lg bg-indigo-600 text-xl">
          <i class="fa-solid fa-tooth"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-wide sm:text-xl">115 衝刺班出席系統</h1>
          <p class="text-xs text-slate-400">學生出席回覆與管理員課程彙整</p>
        </div>
      </button>
      <nav class="grid grid-cols-2 rounded-lg border border-slate-800 bg-slate-900 p-1 sm:flex">
        <button id="studentTab" class="tab-button rounded-md px-4 py-2 text-sm font-bold" data-tab="student">
          <i class="fa-solid fa-user-check mr-1"></i>學生
        </button>
        <button id="adminTab" class="tab-button rounded-md px-4 py-2 text-sm font-bold" data-tab="admin">
          <i class="fa-solid fa-chart-simple mr-1"></i>管理員
        </button>
      </nav>
    </div>
  </header>

  <main class="safe-bottom mx-auto max-w-6xl px-3 py-4 sm:px-4 sm:py-6">
    <div id="configWarning" class="mb-5 hidden rounded-lg border border-amber-300 bg-amber-50 p-4 text-sm text-amber-900">
      尚未設定 Apps Script 網址。請部署 <code>apps-script/Code.gs</code> 後，把 Web App URL 填入 <code>APPS_SCRIPT_URL</code>。
    </div>

    <section class="mb-6 grid gap-4 md:grid-cols-[1fr_360px]">
      <div id="homeImageCard" class="overflow-hidden rounded-lg bg-white shadow-sm"></div>
      <div class="grid gap-4">
        <div id="homeMessageCarousel" class="rounded-lg bg-white p-5 shadow-sm"></div>
        <div class="rounded-lg bg-slate-900 p-5 text-white shadow-sm">
        <p class="text-xs font-bold text-slate-400">今日</p>
        <div id="todayText" class="mt-1 text-2xl font-bold"></div>
        <div class="mt-4 rounded-lg border border-slate-700 bg-slate-800/70 p-3">
          <p class="text-xs font-bold text-slate-400">國考倒數</p>
          <div id="examCountdown" class="mt-1 text-2xl font-bold text-amber-300"></div>
          <p class="mt-1 text-xs text-slate-400">7/26 國考</p>
        </div>
      </div>
      </div>
    </section>

    <section id="announcementBoard" class="mb-6 rounded-lg bg-white p-5 shadow-sm"></section>

    <section id="studentView" class="grid gap-6 lg:grid-cols-[360px_1fr]">
      <div class="space-y-5">
        <div class="rounded-lg bg-white p-5 shadow-sm">
          <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
            <h3 class="text-base font-bold">學生登入</h3>
            <p class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-bold leading-5 text-amber-900">
              初次登入請點下方「註冊」並填寫資料
            </p>
          </div>
          <form id="studentLoginForm" class="mt-4 space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-500" for="studentId">學號</label>
              <input id="studentId" required autocomplete="username" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm uppercase outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" placeholder="例如 A115001">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500" for="studentPassword">個人密碼</label>
              <input id="studentPassword" required type="password" autocomplete="current-password" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
              <p class="mt-1 text-xs text-slate-500">忘記密碼請聯絡老師/班代在後台重設。</p>
            </div>
            <button class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-bold text-white hover:bg-indigo-500" type="submit">
              登入
            </button>
          </form>
        </div>

        <div class="rounded-lg bg-white p-5 shadow-sm">
          <button id="toggleRegister" class="flex w-full items-center justify-between text-left text-base font-bold">
            <span><i class="fa-solid fa-user-plus mr-2 text-emerald-600"></i>註冊</span>
            <i class="fa-solid fa-chevron-down text-slate-400"></i>
          </button>
          <form id="registerForm" class="mt-4 hidden space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-500" for="regId">學號</label>
                <input id="regId" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm uppercase" placeholder="">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500" for="regName">姓名</label>
                <input id="regName" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500" for="regPassword">設定個人密碼</label>
              <input id="regPassword" required type="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-500" for="regYear">畢業年份</label>
                <select id="regYear" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-500" for="regType">班別</label>
                <select id="regType" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                  <option>甲班</option>
                  <option>乙班</option>
                </select>
              </div>
            </div>
            <button class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 text-sm font-bold text-white hover:bg-emerald-500" type="submit">
              建立資料並登入
            </button>
          </form>
        </div>
      </div>

      <div class="space-y-5">
        <div id="studentPanel" class="rounded-lg bg-white p-5 shadow-sm">
          <div class="flex items-center gap-3 text-slate-500">
            <i class="fa-solid fa-circle-info text-indigo-500"></i>
            <p class="text-sm">登入後即可查看課程月曆與出席回覆。</p>
          </div>
        </div>
      </div>
    </section>

    <section id="adminView" class="hidden">
      <div id="adminLoginPanel" class="mx-auto max-w-md rounded-lg bg-white p-6 shadow-sm">
        <h3 class="text-lg font-bold">管理員登入</h3>
        <p class="mt-2 text-sm text-slate-500">登入後可管理課程、名單、密碼與匯出表格。</p>
        <form id="adminLoginForm" class="mt-5 space-y-3">
          <input id="adminPassword" required type="password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="管理員密碼">
          <button class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-bold text-white hover:bg-slate-800" type="submit">登入管理員</button>
        </form>
      </div>

      <div id="adminPanel" class="hidden space-y-5">
        <div class="flex flex-col gap-3 rounded-lg bg-white p-5 shadow-sm sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h3 class="text-lg font-bold">出席管理</h3>
            <p id="adminMeta" class="mt-1 text-sm text-slate-500"></p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="refreshAdmin" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white hover:bg-indigo-500">
              <i class="fa-solid fa-rotate-right mr-1"></i>重新整理
            </button>
            <button id="exportCsv" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-bold text-white hover:bg-slate-800">
              <i class="fa-solid fa-table mr-1"></i>匯出 Excel
            </button>
            <button id="adminLogout" class="rounded-lg bg-rose-50 px-4 py-2 text-sm font-bold text-rose-700 hover:bg-rose-100">
              登出
            </button>
          </div>
        </div>
        <div id="attendanceCategoryPanel" class="rounded-lg bg-white p-5 shadow-sm"></div>
        <div id="adminCalendar" class="rounded-lg bg-white p-5 shadow-sm"></div>
        <div id="passwordPanel" class="rounded-lg bg-white p-5 shadow-sm"></div>
        <div id="homeImagePanel" class="rounded-lg bg-white p-5 shadow-sm"></div>
        <div id="homeMessagePanel" class="rounded-lg bg-white p-5 shadow-sm"></div>
        <div id="announcementPanel" class="rounded-lg bg-white p-5 shadow-sm"></div>
        <div id="adminSummary" class="space-y-4"></div>
      </div>
    </section>
  </main>

  <div id="sessionModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70 p-4"></div>
  <div id="loadingOverlay" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-950/35 backdrop-blur-sm">
    <div class="flex items-center gap-3 rounded-lg bg-white px-5 py-4 text-sm font-bold text-slate-700 shadow-xl">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-slate-200 border-t-indigo-600"></span>
      讀取中...
    </div>
  </div>
  <div id="toast" class="fixed bottom-4 left-1/2 z-50 hidden max-w-[92vw] -translate-x-1/2 rounded-lg px-4 py-3 text-sm font-bold shadow-lg"></div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMWFE_2hiK6qhz7Cg_oBFzGWMMrQ9LqVL-2f__jsb-MpouieZ1RPe6s-sjLu0gORfInw/exec';
    const TIME_ZONE = 'Asia/Taipei';
    const DEFAULT_YEAR = 2026;
    const WEEKDAYS = ['一', '二', '三', '四', '五', '六', '日'];
    const INFO_ONLY_SESSION_KEYS = ['0708', '0725', '0726', '0727', '0728'];
    const HIGHLIGHT_ONLY_SESSION_KEYS = ['0726', '0727'];
    const DEFAULT_HOME_MESSAGES = [
      { message_id: '1', title: '每天前進一點點', body: '國考不是一天衝完，是每天多記住一題、多練熟一步。' },
      { message_id: '2', title: '記得回覆出席', body: '老師不是要抓人，是要先幫大家準備位置、器材和冷氣。' },
      { message_id: '3', title: '把錯題當線索', body: '錯題不是失敗紀錄，是提醒你下一次會更穩的路標。' },
    ];
    const DEFAULT_HOME_IMAGE_CARD = {
      title: '課表',
      body: '點選圖片可放大查看。',
      image_url: 'assets/schedule-web-20260703.webp',
      link_url: '',
      visible: true,
    };
    const HOME_IMAGE_CACHE_KEY = 'cramAttendance.latestHomeImageCard';
    const STATIC_HOME_IMAGE_URLS = [
      'assets/schedule-web.webp',
      'assets/schedule-web-20260703.webp',
    ];
    const DEFAULT_ANNOUNCEMENTS = [
      { announcement_id: '1', body: '請同學完成出席填寫，方便老師統計人數與準備教室。' },
      { announcement_id: '2', body: '課表若有異動，會以老師公告及系統內容為準。' },
    ];
    const SPECIAL_MARKER_SESSIONS = {
      '0708': { session_key: '0708', date: '07/08', day: '三', time: '視簡章規定時間', subject: '聯合免試', teacher: '全體自主行程', type: 'event', classroom: '校外/自主', notes: '此日期只在月曆標記，不需要回覆參加 / 不參加。', visible: true, editable: false, attendance_required: false },
      '0725': { session_key: '0725', date: '07/25', day: '六', time: '', subject: '國考行程標記', teacher: '', type: 'national_exam', classroom: '', notes: '此日期只在月曆標記，不需要回覆參加 / 不參加。', visible: true, editable: false, attendance_required: false },
      '0726': { session_key: '0726', date: '07/26', day: '日', time: '', subject: '國考第一天', teacher: '', type: 'national_exam', classroom: '', notes: '第 1 節：預備 8:40，考試 9:00-10:00，牙體技術學（一）\n第 2 節：預備 10:30，考試 10:40-11:40，牙體技術學（二）\n第 3 節：預備 12:50，考試 13:00-14:00，牙體技術學（三）\n第 4 節：預備 14:30，考試 14:40-15:40，牙體技術學（四）', visible: true, editable: false, attendance_required: false, special_highlight: true },
      '0727': { session_key: '0727', date: '07/27', day: '一', time: '', subject: '國考第二天', teacher: '', type: 'national_exam', classroom: '', notes: '第 5 節：預備 8:40，考試 9:00-12:00，全口活動義齒排列\n第 6 節：預備 13:40，考試 14:00-15:00，牙體解剖形態雕刻', visible: true, editable: false, attendance_required: false, special_highlight: true },
      '0728': { session_key: '0728', date: '07/28', day: '二', time: '', subject: '國考後續標記', teacher: '', type: 'national_exam', classroom: '', notes: '此日期只在月曆標記，不需要回覆參加 / 不參加。', visible: true, editable: false, attendance_required: false },
    };

    const state = {
      activeTab: 'student',
      student: null,
      studentPassword: '',
      sessions: [],
      studentViewMode: 'calendar',
      studentMonth: 7,
      selectedStudentDate: '',
      pendingSessions: {},
      adminPassword: '',
      adminData: null,
      adminMonth: 7,
      selectedAdminDate: '',
      homeMessages: DEFAULT_HOME_MESSAGES,
      announcements: [],
      homeImageCard: readCachedHomeImageCard() || DEFAULT_HOME_IMAGE_CARD,
      announcementsLoaded: false,
      activeHomeMessage: 0,
      homeMessageTimer: null,
      mobileBackGuardReady: false,
    };

    const $ = (id) => document.getElementById(id);
    const isConfigured = () => APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes('PASTE_YOUR');

    document.addEventListener('DOMContentLoaded', () => {
      $('todayText').textContent = new Intl.DateTimeFormat('zh-TW', {
        timeZone: TIME_ZONE,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        weekday: 'short',
      }).format(new Date());
      $('examCountdown').textContent = examCountdownText();

      populateGraduationYears();

      if (!isConfigured()) $('configWarning').classList.remove('hidden');
      bindEvents();
      initMobileBackGuard();
      renderHomeMessages();
      renderHomeImageCard();
      renderAnnouncementBoard();
      loadHomeMessages();
      renderTabs();
    });

    function getCurrentRocYear() {
      const now = new Date();
      const taiwanYear = new Intl.DateTimeFormat('en-CA', {
        timeZone: TIME_ZONE,
        year: 'numeric',
      }).format(now);
      const currentRocYear = Number(taiwanYear) - 1911;
      return Number.isFinite(currentRocYear) && currentRocYear >= 95 ? currentRocYear : 115;
    }

    function graduationYearOptionsHtml(currentValue = '') {
      const startRocYear = 95;
      const endRocYear = getCurrentRocYear();
      const current = String(currentValue || '').trim();
      return Array.from({ length: endRocYear - startRocYear + 1 }, (_, index) => {
        const year = startRocYear + index;
        const value = `${year}年`;
        const selected = current ? value === current : year === endRocYear;
        return `<option value="${escapeAttr(value)}" ${selected ? 'selected' : ''}>${escapeHtml(value)}</option>`;
      }).join('');
    }

    function populateGraduationYears() {
      const select = $('regYear');
      if (!select) return;
      select.innerHTML = graduationYearOptionsHtml();
    }

    function bindEvents() {
      document.querySelectorAll('.tab-button').forEach((button) => {
        button.addEventListener('click', () => {
          state.activeTab = button.dataset.tab;
          renderTabs();
        });
      });

      $('homeBrand').addEventListener('click', () => {
        state.activeTab = 'student';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderTabs();
      });

      $('studentLoginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        await studentLogin($('studentId').value.trim().toUpperCase(), $('studentPassword').value);
      });

      $('toggleRegister').addEventListener('click', () => {
        $('registerForm').classList.toggle('hidden');
      });

      $('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        await registerStudent();
      });

      $('adminLoginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        state.adminPassword = $('adminPassword').value;
        await adminLogin();
      });

      $('refreshAdmin').addEventListener('click', loadAdminSummary);
      $('exportCsv').addEventListener('click', exportExcel);
      $('adminLogout').addEventListener('click', () => {
        if (confirmAdminLogout()) performAdminLogout();
      });
    }

    async function loadHomeMessages() {
      if (!isConfigured()) return;
      try {
        const response = await api('getHomeMessages', {}, { showOverlay: false });
        if (response && Array.isArray(response.messages) && response.messages.length) {
          state.homeMessages = response.messages;
          state.activeHomeMessage = 0;
          renderHomeMessages();
        }
        if (response && Array.isArray(response.announcements) && response.announcements.length) {
          state.announcements = response.announcements;
        }
        if (response && response.homeImageCard) {
          applyRemoteHomeImageCard(response.homeImageCard);
        }
        state.announcementsLoaded = true;
        renderAnnouncementBoard();
      } catch (error) {
        state.announcementsLoaded = true;
        renderAnnouncementBoard();
        // Home messages are not required for login; keep the page usable if loading fails.
      }
    }

    function renderHomeMessages() {
      const container = $('homeMessageCarousel');
      if (!container) return;
      const messages = state.homeMessages.length ? state.homeMessages : DEFAULT_HOME_MESSAGES;
      const active = messages[state.activeHomeMessage % messages.length] || messages[0];
      container.innerHTML = `
        <div class="flex h-full flex-col justify-between gap-4">
          <div>
            <div class="min-h-[120px] rounded-lg border border-slate-200 bg-slate-50 p-4">
              <p class="text-xs font-bold text-slate-400">今日提醒</p>
              <h2 class="mt-2 text-2xl font-bold">${escapeHtml(active.title || '')}</h2>
              <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">${escapeHtml(active.body || '')}</p>
            </div>
          </div>
          <div class="flex items-center justify-end">
            <div class="flex items-center gap-2">
              ${messages.map((_, index) => `<button type="button" class="home-message-dot h-2.5 w-2.5 rounded-full ${index === state.activeHomeMessage ? 'bg-indigo-600' : 'bg-slate-300'}" data-message-index="${index}" aria-label="切換提醒 ${index + 1}"></button>`).join('')}
            </div>
          </div>
        </div>
      `;
      container.querySelectorAll('[data-message-index]').forEach((button) => {
        button.addEventListener('click', () => {
          state.activeHomeMessage = Number(button.dataset.messageIndex);
          renderHomeMessages();
          startHomeMessageTimer();
        });
      });
      startHomeMessageTimer();
    }

    function startHomeMessageTimer() {
      if (state.homeMessageTimer) window.clearInterval(state.homeMessageTimer);
      const messages = state.homeMessages.length ? state.homeMessages : DEFAULT_HOME_MESSAGES;
      if (messages.length < 2) return;
      state.homeMessageTimer = window.setInterval(() => {
        state.activeHomeMessage = (state.activeHomeMessage + 1) % messages.length;
        renderHomeMessages();
      }, 5000);
    }

    function isStaticHomeImageUrl(imageUrl) {
      const url = String(imageUrl || '').trim();
      return STATIC_HOME_IMAGE_URLS.includes(url);
    }

    function hasFreshHomeImage(card) {
      return Boolean(card && card.image_url && !isStaticHomeImageUrl(card.image_url));
    }

    function readCachedHomeImageCard() {
      try {
        const cached = JSON.parse(window.localStorage.getItem(HOME_IMAGE_CACHE_KEY) || 'null');
        return hasFreshHomeImage(cached) ? normalizeHomeImageCard(cached) : null;
      } catch (error) {
        return null;
      }
    }

    function cacheHomeImageCard(card) {
      if (!hasFreshHomeImage(card)) return;
      try {
        window.localStorage.setItem(HOME_IMAGE_CACHE_KEY, JSON.stringify(card));
      } catch (error) {
        // Cache is only a speed/fallback helper; ignore storage failures.
      }
    }

    function remoteHomeImageCardToApply(card) {
      if (!card) return null;
      const normalized = normalizeHomeImageCard(card);
      if (hasFreshHomeImage(normalized)) return normalized;
      return null;
    }

    function applyHomeImageCard(card) {
      const nextCard = normalizeHomeImageCard(card);
      state.homeImageCard = nextCard;
      cacheHomeImageCard(nextCard);
      renderHomeImageCard();
      return nextCard;
    }

    function applyRemoteHomeImageCard(card) {
      const remoteCard = remoteHomeImageCardToApply(card);
      if (!remoteCard) return false;
      state.homeImageCard = remoteCard;
      cacheHomeImageCard(remoteCard);
      renderHomeImageCard();
      return true;
    }

    function normalizeHomeImageCard(card) {
      const normalized = Object.assign({}, DEFAULT_HOME_IMAGE_CARD, card || {});
      if (normalized.image_url === 'assets/schedule-web.webp') {
        normalized.image_url = DEFAULT_HOME_IMAGE_CARD.image_url;
      }
      if (!normalized.image_url) {
        return Object.assign({}, DEFAULT_HOME_IMAGE_CARD, {
          visible: normalized.visible !== false,
        });
      }
      return normalized;

    function examCountdownText() {
      const todayText = new Intl.DateTimeFormat('en-CA', {
        timeZone: TIME_ZONE,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).format(new Date());
      const today = new Date(`${todayText}T00:00:00+08:00`);
      const exam = new Date(`${DEFAULT_YEAR}-07-26T00:00:00+08:00`);
      const days = Math.ceil((exam - today) / 86400000);
      if (days > 0) return `${days} 天`;
      if (days === 0) return '就是今天';
      return '已開始';

    function sortAnnouncements(announcements) {
      return [...(announcements || [])].sort((a, b) => {
        const aTime = announcementTimestamp(a);
        const bTime = announcementTimestamp(b);
        if (aTime && bTime) return bTime - aTime;
        if (aTime) return -1;
        if (bTime) return 1;
        return Number(a.sort_order || 0) - Number(b.sort_order || 0);
      });
    }

    function isNewAnnouncement(announcement) {
      const createdAt = announcementTimestamp(announcement);
      if (!createdAt) return false;
      const age = Date.now() - createdAt;
      return age >= 0 && age <= 3 * 24 * 60 * 60 * 1000;
    }

    function announcementTimestamp(announcement) {
      const value = String((announcement && announcement.created_at) || '').trim();
      if (!value) return 0;
      const normalized = value.includes('T') ? value : `${value.replace(' ', 'T')}+08:00`;
      const time = new Date(normalized).getTime();
      return Number.isFinite(time) ? time : 0;
    }

    function isMobileMode() {
      return window.matchMedia && window.matchMedia('(max-width: 640px)').matches;

    function initMobileBackGuard() {
      if (!isMobileMode() || state.mobileBackGuardReady) return;
      state.mobileBackGuardReady = true;
      try {
        history.replaceState(Object.assign({}, history.state, { attendanceBase: true }), document.title);
        history.pushState({ attendanceGuard: true }, document.title);
      } catch (error) {
        return;
      }

      window.addEventListener('popstate', () => {
        if (!isMobileMode()) return;
        handleMobileBack();
      });

      window.addEventListener('beforeunload', (event) => {
        if (state.student || state.adminData) {
          event.preventDefault();
          event.returnValue = '';
        }
      });
    }

    function rearmMobileBackGuard() {
      if (!isMobileMode()) return;
      try {
        history.pushState({ attendanceGuard: true }, document.title);
      } catch (error) {}
    }

    function handleMobileBack() {
      if (isSessionModalOpen()) {
        closeSessionModal();
        rearmMobileBackGuard();
        return;
      }

      if (state.student) {
        if (confirmStudentLogout()) performStudentLogout();
        rearmMobileBackGuard();
        return;
      }

      if (state.adminData) {
        if (confirmAdminLogout()) performAdminLogout();
        rearmMobileBackGuard();
        return;
      }

      // 沒有登入狀態時，第二次返回才交給瀏覽器離開頁面。
    }

    async function updateStatus(sessionKey, status) {
      const key = normalizeSessionKey(sessionKey);
      if (isInfoOnlySession(key)) {
        showToast('此日期只做月曆標記，不需要回覆參加 / 不參加。', 'warning');
        return;
      }
      const previous = getLocalSessionStatus(key);
      if (previous === status) return;

      updateLocalSessionStatus(key, status);
      setSessionPending(key, true);
      renderStudentPanel();

      try {
        const response = await updateAttendanceApi(key, status);
        applyAttendanceResponse(response, key, status);
        setSessionPending(key, false);
        renderStudentPanel();
        showToast('出席狀態已更新。');
      } catch (error) {
        updateLocalSessionStatus(key, previous);
        setSessionPending(key, false);
        renderStudentPanel();
        showToast(error.message, 'warning');
      }
    }

    async function markAllAttend() {
      const editableKeys = state.sessions.filter((session) => session.editable && !isInfoOnlySession(session)).map((session) => normalizeSessionKey(session.session_key));
      const previous = editableKeys.reduce((acc, key) => {
        acc[key] = getLocalSessionStatus(key);
        return acc;
      }, {});
      editableKeys.forEach((key) => {
        updateLocalSessionStatus(key, 'attend');
        setSessionPending(key, true);
      });
      renderStudentPanel();

      try {
        let response;
        try {
          response = await api('updateAllAttendance', {
            student_id: state.student.student_id,
            password: state.studentPassword,
          });
          applyAttendanceResponse(response);
        } catch (error) {
          if (!String(error.message || '').includes('Unknown action')) throw error;
          const editableSessions = state.sessions.filter((session) => session.editable);
          for (const session of editableSessions) {
            response = await updateAttendanceApi(session.session_key, 'attend');
            applyAttendanceResponse(response, session.session_key, 'attend');
          }
        }
        editableKeys.forEach((key) => setSessionPending(key, false));
        renderStudentPanel();
        showToast('已將可修改課程全部設為參加。');
      } catch (error) {
        Object.keys(previous).forEach((key) => {
          updateLocalSessionStatus(key, previous[key]);
          setSessionPending(key, false);
        });
        renderStudentPanel();
        showToast(error.message, 'warning');
      }
    }

    function applyStudentProfileResponse(response, fallbackPayload, nextPassword) {
      if (response && response.student) {
        state.student = response.student;
      } else {
        state.student = Object.assign({}, state.student, {
          name: fallbackPayload.name,
          year: fallbackPayload.year,
          type: fallbackPayload.type,
        });
      }
      if (response && Array.isArray(response.sessions)) state.sessions = response.sessions;
      if (nextPassword) {
        state.studentPassword = nextPassword;
        if ($('studentPassword')) $('studentPassword').value = nextPassword;

    async function updateAttendanceApi(sessionKey, status) {
      const normalizedKey = normalizeSessionKey(sessionKey);
      try {
        return await api('updateAttendance', {

          password: state.studentPassword,
          session_key: normalizedKey,
          status,
        }, { showOverlay: false });
      } catch (error) {
        const message = String(error.message || '');
        const legacyKey = legacySessionKey(normalizedKey);
        if (legacyKey === normalizedKey || !/找不到|課程|course/i.test(message)) throw error;
        return api('updateAttendance', {
          student_id: state.student.student_id,
          password: state.studentPassword,
          session_key: legacyKey,
          status,
        }, { showOverlay: false });
      }
    }

    function getLocalSessionStatus(sessionKey) {
      const key = normalizeSessionKey(sessionKey);
      const session = state.sessions.find((item) => normalizeSessionKey(item.session_key) === key);
      return normalizeStatus(session ? session.status : 'absent');
    }

    function updateLocalSessionStatus(sessionKey, status) {
      const key = normalizeSessionKey(sessionKey);
      state.sessions = state.sessions.map((session) => {
        if (normalizeSessionKey(session.session_key) !== key) return session;
        return Object.assign({}, session, { session_key: key, status: normalizeStatus(status) });
      });
    }

    function applyAttendanceResponse(response, fallbackKey, fallbackStatus) {
      if (response && Array.isArray(response.updated)) {
        response.updated.forEach((item) => applyAttendanceResponse(item));
        return;
      }
      if (response && Array.isArray(response.sessions)) {
        state.sessions = response.sessions;
        return;
      }
      const key = normalizeSessionKey((response && response.session_key) || fallbackKey);
      const status = normalizeStatus((response && response.status) || fallbackStatus);
      if (key) updateLocalSessionStatus(key, status);
    }

    function setSessionPending(sessionKey, pending) {
      const key = normalizeSessionKey(sessionKey);
      if (pending) {
        state.pendingSessions[key] = true;
      } else {
        delete state.pendingSessions[key];
      }
    }

    function isSessionPending(sessionKey) {
      return Boolean(state.pendingSessions[normalizeSessionKey(sessionKey)]);
    }

    function hasPendingSessions() {
      return Object.keys(state.pendingSessions).length > 0;
    }

    function compressImageFile(file) {
      if (!file.type.startsWith('image/')) {
        return Promise.reject(new Error('請選擇圖片檔。'));
      }
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('圖片讀取失敗，請換一張圖片。'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('圖片格式無法讀取，請換一張圖片。'));
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const attempts = [
              { width: 1100, quality: 0.8 },
              { width: 920, quality: 0.68 },
              { width: 760, quality: 0.56 },
              { width: 620, quality: 0.46 },
            ];
            for (const attempt of attempts) {
              const scale = Math.min(1, attempt.width / img.width);
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg', attempt.quality);
              if (dataUrl.length <= 45000) {
                resolve(dataUrl);
                return;
              }
            }
            reject(new Error('圖片太大，請改用較小或較簡單的圖片。'));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function generateScheduleImageDataUrl(sessions, month = 7) {
      const svgUrl = generateScheduleSvgDataUrl(sessions, month);
      if (svgUrl.length <= 45000) return svgUrl;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('\u7121\u6cd5\u7522\u751f\u5716\u7247');

      const attempts = [
        { width: 1040, quality: 0.62 },
        { width: 900, quality: 0.54 },
        { width: 760, quality: 0.46 },
        { width: 640, quality: 0.38 },
        { width: 560, quality: 0.32 },
        { width: 480, quality: 0.26 },
        { width: 420, quality: 0.22 },
        { width: 360, quality: 0.18 },
      ];

      for (const attempt of attempts) {
        canvas.width = attempt.width;
        canvas.height = Math.round(attempt.width / 1.846);
        drawScheduleCanvas(ctx, canvas.width, canvas.height, sessions, month);

        const jpegUrl = canvas.toDataURL('image/jpeg', attempt.quality);
        if (jpegUrl.length <= 45000) return jpegUrl;

        const webpUrl = canvas.toDataURL('image/webp', attempt.quality);
        if (webpUrl.startsWith('data:image/webp') && webpUrl.length <= 45000) return webpUrl;
      }

      throw new Error('\u7522\u751f\u7684\u8ab2\u8868\u5716\u904e\u5927');
    }

    function generateScheduleSvgDataUrl(sessions, month = 7) {
      const width = 1400;
      const height = 980;
      const padding = 42;
      const titleHeight = 76;
      const headerHeight = 46;
      const gridX = padding;
      const gridY = padding + titleHeight;
      const gridW = width - padding * 2;
      const gridH = height - gridY - padding;
      const cellW = gridW / 7;
      const cellH = (gridH - headerHeight) / 5;
      const byDate = scheduleSessionsByDate(sessions, month);
      const days = generateCalendarGrid(DEFAULT_YEAR, month);
      const weekdayLabels = ['\u4e00', '\u4e8c', '\u4e09', '\u56db', '\u4e94', '\u516d', '\u65e5'];
      const parts = [];

      parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`);
      parts.push('<rect width="100%" height="100%" fill="#fffaf5"/>');
      parts.push(`<rect x="${padding / 2}" y="${padding / 2}" width="${width - padding}" height="${height - padding}" rx="18" fill="#f8fafc"/>`);
      parts.push(`<text x="${padding}" y="${padding + 34}" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="46" font-weight="700" fill="#102033">${DEFAULT_YEAR}\u5e74 ${month}\u6708\u8ab2\u8868</text>`);
      parts.push(`<text x="${padding}" y="${padding + 62}" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="17" font-weight="600" fill="#64748b">\u9996\u9801\u5feb\u53d6\u7248\uff0c\u5f8c\u53f0\u8ab2\u7a0b\u5132\u5b58\u5f8c\u81ea\u52d5\u66f4\u65b0</text>`);
      parts.push(`<rect x="${gridX}" y="${gridY}" width="${gridW}" height="${headerHeight}" rx="8" fill="#d7f2e5"/>`);

      weekdayLabels.forEach((day, index) => {
        const x = gridX + cellW * index + cellW / 2;
        const fill = index >= 5 ? '#b91c1c' : '#166534';
        parts.push(`<text x="${x}" y="${gridY + 30}" text-anchor="middle" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="22" font-weight="700" fill="${fill}">${day}</text>`);
      });

      parts.push(`<rect x="${gridX}" y="${gridY}" width="${gridW}" height="${headerHeight + cellH * 5}" fill="none" stroke="#1f2937" stroke-width="2"/>`);
      for (let col = 1; col < 7; col += 1) {
        const x = gridX + cellW * col;
        parts.push(`<line x1="${x}" y1="${gridY}" x2="${x}" y2="${gridY + headerHeight + cellH * 5}" stroke="#1f2937" stroke-width="2"/>`);
      }
      for (let row = 0; row <= 5; row += 1) {
        const y = gridY + headerHeight + cellH * row;
        parts.push(`<line x1="${gridX}" y1="${y}" x2="${gridX + gridW}" y2="${y}" stroke="#1f2937" stroke-width="2"/>`);
      }

      days.slice(0, 35).forEach((day, index) => {
        if (!day) return;
        const col = index % 7;
        const row = Math.floor(index / 7);
        const x = gridX + cellW * col;
        const y = gridY + headerHeight + cellH * row;
        const key = `${String(month).padStart(2, '0')}${String(day).padStart(2, '0')}`;
        const daySlots = byDate[key] || { morning: [], afternoon: [] };
        parts.push(`<text x="${x + 14}" y="${y + 40}" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="34" font-weight="700" fill="#0f172a">${day}</text>`);
        parts.push(`<line x1="${x + 8}" y1="${y + cellH / 2}" x2="${x + cellW - 8}" y2="${y + cellH / 2}" stroke="#cbd5e1" stroke-width="1.4"/>`);
        parts.push(scheduleSlotSvg(daySlots.morning, x, y + cellH * 0.08, cellW, cellH * 0.4));
        parts.push(scheduleSlotSvg(daySlots.afternoon, x, y + cellH * 0.53, cellW, cellH * 0.4));
      });

      parts.push('</svg>');
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(parts.join(''))}`;
    }

    function scheduleSlotSvg(items, cellX, slotY, cellW, slotH) {
      if (!items.length) return '';
      const parts = [];
      const itemGap = 6;
      const itemX = cellX + 48;
      const itemW = cellW - 56;
      const itemH = Math.min((slotH - itemGap * (items.length - 1)) / items.length, slotH * 0.9);
      items.slice(0, 2).forEach((item, index) => {
        const boxY = slotY + index * (itemH + itemGap);
        const style = scheduleItemSvgStyle(item);
        parts.push(`<rect x="${itemX}" y="${boxY}" width="${itemW}" height="${itemH}" rx="8" fill="${style.fill}" stroke="${style.stroke}" stroke-width="2"/>`);
        parts.push(svgWrappedText(item.label, itemX + 11, boxY + 22, itemW - 22, itemH, 18));
      });
      return parts.join('');
    }

    function scheduleItemSvgStyle(item) {
      const isMarker = isInfoOnlySession(item);
      if (item.type === 'national_exam') return { fill: '#fde68a', stroke: '#b45309' };
      if (isMarker) return { fill: '#dbeafe', stroke: '#2563eb' };
      return { fill: '#fde7d7', stroke: '#c2410c' };
    }

    function svgWrappedText(text, x, y, maxWidth, boxHeight, fontSize) {
      const lineHeight = fontSize + 5;
      const maxLines = boxHeight >= 76 ? 3 : boxHeight >= 50 ? 2 : 1;
      const maxChars = Math.max(4, Math.floor(maxWidth / (fontSize * 0.92)));
      const lines = wrapTextByChars(text, maxChars, maxLines);
      const tspans = lines.map((line, index) => `<tspan x="${x}" dy="${index === 0 ? 0 : lineHeight}">${escapeXml(line)}</tspan>`).join('');
      return `<text x="${x}" y="${y}" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="${fontSize}" font-weight="700" fill="#111827">${tspans}</text>`;
    }

    function wrapTextByChars(text, maxChars, maxLines) {
      const chars = Array.from(String(text || ''));
      const lines = [];
      for (let index = 0; index < chars.length && lines.length < maxLines; index += maxChars) {
        lines.push(chars.slice(index, index + maxChars).join(''));
      }
      if (chars.length > maxChars * maxLines && lines.length) {
        lines[lines.length - 1] = `${lines[lines.length - 1].slice(0, Math.max(1, maxChars - 1))}\u2026`;
      }
      return lines;
    }

    function drawScheduleCanvas(ctx, width, height, sessions, month) {
      const padding = Math.round(width * 0.035);
      const titleHeight = Math.round(height * 0.13);
      const headerHeight = Math.round(height * 0.075);
      const gridX = padding;
      const gridY = padding + titleHeight;
      const gridW = width - padding * 2;
      const gridH = height - gridY - padding;
      const cellW = gridW / 7;
      const cellH = (gridH - headerHeight) / 5;
      const byDate = scheduleSessionsByDate(sessions, month);
      const days = generateCalendarGrid(DEFAULT_YEAR, month);

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#fffaf5';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#f8fafc';
      roundedRect(ctx, padding * 0.5, padding * 0.5, width - padding, height - padding, Math.round(width * 0.018));
      ctx.fill();

      ctx.fillStyle = '#102033';
      ctx.font = `700 ${Math.round(width * 0.036)}px "Microsoft JhengHei", "Noto Sans TC", sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.fillText(`${DEFAULT_YEAR}\u5e74 ${month}\u6708\u8ab2\u8868`, padding, padding + titleHeight * 0.36);
      ctx.font = `600 ${Math.round(width * 0.014)}px "Microsoft JhengHei", "Noto Sans TC", sans-serif`;
      ctx.fillStyle = '#64748b';
      ctx.fillText('\u9996\u9801\u5feb\u53d6\u7248\uff0c\u5f8c\u53f0\u8ab2\u7a0b\u5132\u5b58\u5f8c\u81ea\u52d5\u66f4\u65b0', padding, padding + titleHeight * 0.75);

      ctx.fillStyle = '#d7f2e5';
      roundedRect(ctx, gridX, gridY, gridW, headerHeight, Math.round(width * 0.008));
      ctx.fill();

      const weekdayLabels = ['\u4e00', '\u4e8c', '\u4e09', '\u56db', '\u4e94', '\u516d', '\u65e5'];
      ctx.font = `700 ${Math.round(width * 0.017)}px "Microsoft JhengHei", "Noto Sans TC", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      weekdayLabels.forEach((day, index) => {
        ctx.fillStyle = index >= 5 ? '#b91c1c' : '#166534';
        ctx.fillText(day, gridX + cellW * index + cellW / 2, gridY + headerHeight / 2);
      });

      ctx.strokeStyle = '#1f2937';
      ctx.lineWidth = Math.max(1, Math.round(width * 0.0015));
      ctx.strokeRect(gridX, gridY, gridW, headerHeight + cellH * 5);
      for (let col = 1; col < 7; col += 1) {
        line(ctx, gridX + cellW * col, gridY, gridX + cellW * col, gridY + headerHeight + cellH * 5);
      }
      for (let row = 0; row <= 5; row += 1) {
        const y = gridY + headerHeight + cellH * row;
        line(ctx, gridX, y, gridX + gridW, y);
      }

      days.slice(0, 35).forEach((day, index) => {
        if (!day) return;
        const col = index % 7;
        const row = Math.floor(index / 7);
        const x = gridX + cellW * col;
        const y = gridY + headerHeight + cellH * row;
        const key = `${String(month).padStart(2, '0')}${String(day).padStart(2, '0')}`;
        const daySlots = byDate[key] || { morning: [], afternoon: [] };

        ctx.fillStyle = '#0f172a';
        ctx.font = `700 ${Math.round(width * 0.022)}px "Microsoft JhengHei", "Noto Sans TC", sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(String(day), x + cellW * 0.08, y + cellH * 0.1);

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = Math.max(1, Math.round(width * 0.0008));
        line(ctx, x + cellW * 0.06, y + cellH * 0.5, x + cellW * 0.94, y + cellH * 0.5);

        drawScheduleSlot(ctx, daySlots.morning, x, y + cellH * 0.12, cellW, cellH * 0.36, width);
        drawScheduleSlot(ctx, daySlots.afternoon, x, y + cellH * 0.54, cellW, cellH * 0.36, width);
      });
    }

    function scheduleSessionsByDate(sessions, month) {
      const byDate = {};
      (sessions || []).forEach((session) => {
        if (!session || monthFromSession(session) !== month) return;
        if (session.visible === false || session.visible === 'false') return;
        const key = normalizeSessionKey(session.session_key || sessionKeyFromDate(session.date));
        if (!/^\d{4}$/.test(key)) return;
        addSessionToScheduleSlots(byDate, key, session);
      });

      Object.keys(SPECIAL_MARKER_SESSIONS).forEach((key) => {
        const marker = SPECIAL_MARKER_SESSIONS[key];
        if (monthFromSession(marker) !== month) return;
        const slots = byDate[key] || { morning: [], afternoon: [] };
        const hasMarker = [...slots.morning, ...slots.afternoon].some((session) => normalizeSessionKey(session.session_key) === key && isInfoOnlySession(session));
        if (!hasMarker) {
          addSessionToScheduleSlots(byDate, key, Object.assign({}, marker));
        }
      });

      Object.keys(byDate).forEach((key) => {
        byDate[key].morning.sort((a, b) => String(a.sortText || '').localeCompare(String(b.sortText || ''), 'zh-Hant-TW'));
        byDate[key].afternoon.sort((a, b) => String(a.sortText || '').localeCompare(String(b.sortText || ''), 'zh-Hant-TW'));
      });
      return byDate;
    }

    function addSessionToScheduleSlots(byDate, key, session) {
      byDate[key] = byDate[key] || { morning: [], afternoon: [] };
      scheduleSlotItems(session).forEach((item) => {
        byDate[key][item.period].push(item);
      });
    }

    function scheduleSlotItems(session) {
      const time = String(session.time || '');
      const subjectParts = splitScheduleParts(session.subject);
      const teacherParts = splitScheduleParts(session.teacher);
      const hasExplicitSplit = /AM|PM|上午|下午/i.test(time) && (subjectParts.length > 1 || teacherParts.length > 1 || /\/|&/.test(time));
      const isFullDay = /全天|整天|09\s*:\s*00\s*-\s*16\s*:\s*00|9\s*:\s*00\s*-\s*16\s*:\s*00/.test(time);
      const hasMorning = /上午|AM|08\s*:|8\s*:|09\s*:|9\s*:|10\s*:|11\s*:|12\s*:/i.test(time);
      const hasAfternoon = /下午|PM|13\s*:|14\s*:|15\s*:|16\s*:/i.test(time);
      const first = scheduleSlotItem(session, subjectParts[0], teacherParts[0], 'morning');
      const second = scheduleSlotItem(session, subjectParts[1] || subjectParts[0], teacherParts[1] || teacherParts[0], 'afternoon');

      if (hasExplicitSplit) return [first, second];
      if (isFullDay || (hasMorning && hasAfternoon) || (!hasMorning && !hasAfternoon)) return [first, second];
      if (hasAfternoon) return [second];
      return [first];
    }

    function scheduleSlotItem(session, subject, teacher, period) {
      const normalizedSubject = cleanScheduleLabel(subject || session.subject);
      const surname = teacherSurname(teacher || session.teacher);
      const alreadyTagged = surname && (normalizedSubject.includes(`(${surname})`) || normalizedSubject.includes(`（${surname}）`));
      return {
        period,
        label: surname && !alreadyTagged ? `${normalizedSubject}(${surname})` : normalizedSubject,
        type: session.type,
        session_key: session.session_key,
        attendance_required: session.attendance_required,
        special_highlight: session.special_highlight,
        sortText: `${session.time || ''} ${normalizedSubject}`,
      };
    }

    function splitScheduleParts(value) {
      const parts = String(value || '')
        .split(/\s*(?:&|＆|\/|／|\+|、)\s*/g)
        .map((part) => cleanScheduleLabel(part))
        .filter(Boolean);
      return parts.length ? parts : [cleanScheduleLabel(value)];
    }

    function teacherSurname(value) {
      const text = String(value || '').replace(/\([^)]*\)|（[^）]*）/g, '').trim();
      const match = text.match(/[\u3400-\u9fff]/);
      return match ? match[0] : '';
    }

    function cleanScheduleLabel(value) {
      return String(value || '')
        .replace(/\s+/g, '')
        .replace(/^\u4e0a\u5348|^\u4e0b\u5348|^AM|^PM/gi, '')
        .replace(/^[\-–—:：/／]+/, '')
        .trim();
    }

    function drawScheduleSlot(ctx, items, cellX, slotY, cellW, slotH, width) {
      if (!items.length) return;
      const itemGap = Math.max(2, Math.round(width * 0.002));
      const itemX = cellX + cellW * 0.2;
      const itemW = cellW * 0.74;
      const itemH = Math.min((slotH - itemGap * (items.length - 1)) / items.length, slotH * 0.9);
      items.slice(0, 2).forEach((item, index) => {
        const boxY = slotY + index * (itemH + itemGap);
        const isMarker = isInfoOnlySession(item);
        const isExam = item.type === 'national_exam';
        ctx.fillStyle = isExam ? '#fde68a' : isMarker ? '#dbeafe' : '#fde7d7';
        ctx.strokeStyle = isExam ? '#b45309' : isMarker ? '#2563eb' : '#c2410c';
        ctx.lineWidth = Math.max(1, Math.round(width * 0.001));
        roundedRect(ctx, itemX, boxY, itemW, itemH, Math.round(width * 0.005));
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#111827';
        ctx.font = `700 ${Math.round(width * 0.014)}px "Microsoft JhengHei", "Noto Sans TC", sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        drawWrappedText(ctx, item.label, itemX + itemW * 0.06, boxY + itemH * 0.18, itemW * 0.88, Math.round(width * 0.017), itemH > slotH * 0.55 ? 2 : 1);
      });
    }

    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const chars = Array.from(String(text || ''));
      let lineText = '';
      let lines = [];
      chars.forEach((char) => {
        const testLine = `${lineText}${char}`;
        if (lineText && ctx.measureText(testLine).width > maxWidth) {
          lines.push(lineText);
          lineText = char;
        } else {
          lineText = testLine;
        }
      });
      if (lineText) lines.push(lineText);
      if (lines.length > maxLines) {
        lines = lines.slice(0, maxLines);
        let last = lines[lines.length - 1];
        while (last.length > 1 && ctx.measureText(`${last}\u2026`).width > maxWidth) {
          last = last.slice(0, -1);
        }
        lines[lines.length - 1] = `${last}\u2026`;
      }
      lines.forEach((line, index) => ctx.fillText(line, x, y + lineHeight * index));
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function line(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function postToAppsScript(action, params = {}) {
      return new Promise((resolve, reject) => {
        showLoading();
        const iframeName = `appsScriptPost_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.className = 'hidden';
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = APPS_SCRIPT_URL;
        form.target = iframeName;
        form.className = 'hidden';

        Object.entries(Object.assign({}, params, { action })).forEach(([key, value]) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = value == null ? '' : String(value);
          form.appendChild(input);
        });

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('圖片上傳逾時，請稍後再試。'));
        }, 25000);

        let submittedAt = 0;
        iframe.onload = () => {
          if (submittedAt && Date.now() - submittedAt < 300) return;
          window.clearTimeout(timeout);
          window.setTimeout(() => {
            cleanup();
            resolve();
          }, 500);
        };

        function cleanup() {
          hideLoading();
          form.remove();
          iframe.remove();
        }

        document.body.appendChild(iframe);
        document.body.appendChild(form);
        submittedAt = Date.now();
        form.submit();
      });
    }

    async function saveHomeMessages(event) {
      event.preventDefault();
      const messages = Array.from(document.querySelectorAll('.home-message-row')).map((row, index) => ({
        message_id: String(index + 1),
        title: row.querySelector('.home-message-title').value.trim(),

      setLoading($('homeMessageForm'), true);
      try {

          password: state.adminPassword,
          messages: JSON.stringify(messages),
        });
        state.adminData = response;
        state.homeMessages = response.messages || messages;
        state.activeHomeMessage = 0;
        renderHomeMessages();

    function announcementFieldHtml(announcement, index) {
      return `
        <div class="announcement-row rounded-lg border border-slate-200 bg-slate-50 p-3" data-announcement-row>

    function exportAttendanceCategoryExcel() {
      const categories = attendanceCategories();
      const ordered = [categories.tutoring_only, categories.mock_only, categories.both];
      const rows = [
        ['出席種類統計'],
        [],
        ['類別', '人數'],
        ...ordered.map((category) => [category.label, String((category.students || []).length)]),
        [],
        ['類別', '學號', '姓名', '畢業年份', '班別'],
      ];
      ordered.forEach((category) => {
        const students = category.students || [];
        if (!students.length) {
          rows.push([category.label, '', '無', '', '']);
          return;
        }
        students.forEach((student) => {
          const year = student.registered === false ? '未註冊' : (student.year || '');
          const type = student.registered === false ? '未註冊' : (student.type || '');
          rows.push([category.label, student.student_id || '', student.name || '', year, type]);
        });
      });

      const blob = createXlsxBlob({
        sheetName: '出席種類統計',
        rows,
        merges: ['A1:E1'],
        colWidths: [22, 16, 18, 16, 16],

    async function adminUpdateSessionApi() {
      const originalKey = String($('editSessionKey').value || '').trim();
      const payload = {
        password: state.adminPassword,
        session_key: originalKey,
        date: $('editDate').value.trim(),
        day: $('editDay').value.trim(),
        time: $('editTime').value.trim(),
        subject: $('editSubject').value.trim(),
        teacher: $('editTeacher').value.trim(),
        type: $('editType').value,
        classroom: $('editClassroom').value.trim(),
        notes: $('editNotes').value.trim(),
        visible: true,
      };

      const candidateKeys = Array.from(new Set([
        originalKey,
        normalizeSessionKey(originalKey),
        legacySessionKey(originalKey),
        sessionKeyFromDate(payload.date),
        legacySessionKey(sessionKeyFromDate(payload.date)),
      ].filter(Boolean)));

      let lastError;
      for (const key of candidateKeys) {
        try {
          return await api('adminUpdateSession', Object.assign({}, payload, { session_key: key }));
        } catch (error) {
          lastError = error;
          const message = String(error.message || '');
          if (!/找不到|內容|課程|session|not found/i.test(message)) throw error;
        }
      }
      throw lastError || new Error('找不到要更新的課程內容。');
    }

      const absentNames = absent.map((item) => `${item.name}（${item.year || '未填年份'}）`).join('、') || '無';
      const title = `115衝刺班簽到表_${safeFilePart(sessionDisplayDate(session))}_${safeFilePart(session.subject)}`;

      const sheetRows = [
        ['115衝刺班簽到表'],
        [],
        ['日期', `${sessionDisplayDate(session)}（${session.day}）`, '時間', session.time || ''],
        ['課程', session.subject || ''],
        ['老師', session.teacher || '', '教室', session.classroom || ''],
        ['備註', session.notes || '無'],
        [],
        ['序號', '畢業年份', '姓名', '簽到', '備註'],
      ];
      if (rows.length) {
        rows.forEach((item, index) => {
          sheetRows.push([String(index + 1), item.year || '', item.name || '', '', '']);
        });
      } else {

      sheetRows.push([]);
      sheetRows.push([`已回覆參加：${attend.length} 人；不參加：${absent.length} 人。`]);
      sheetRows.push([`不參加名單：${absentNames}`]);

      const blob = createXlsxBlob({

      showToast(`已生成 ${sessionDisplayDate(session)} 簽到表。`);

    function createXlsxBlob(sheet) {
      const files = {
        '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`,
        '_rels/.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`,
        'xl/workbook.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets><sheet name="${escapeXml(sheet.sheetName)}" sheetId="1" r:id="rId1"/></sheets>
</workbook>`,
        'xl/_rels/workbook.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`,
        'xl/styles.xml': xlsxStylesXml(),
        'xl/worksheets/sheet1.xml': xlsxWorksheetXml(sheet),
      };
      return new Blob([zipStore(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }

    function xlsxWorksheetXml(sheet) {
      const cols = sheet.colWidths.map((width, index) => `<col min="${index + 1}" max="${index + 1}" width="${width}" customWidth="1"/>`).join('');
      const rows = sheet.rows.map((row, rowIndex) => {
        const rowNumber = rowIndex + 1;
        const height = rowNumber === 1 ? 26 : rowNumber >= 9 && rowNumber <= sheet.rows.length - 3 ? 38 : 22;
        const cells = row.map((value, colIndex) => xlsxCell(value, rowNumber, colIndex + 1, xlsxStyleFor(rowNumber, colIndex + 1))).join('');
        return `<row r="${rowNumber}" ht="${height}" customHeight="1">${cells}</row>`;
      }).join('');
      const merges = sheet.merges.length ? `<mergeCells count="${sheet.merges.length}">${sheet.merges.map((ref) => `<mergeCell ref="${ref}"/>`).join('')}</mergeCells>` : '';
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetViews><sheetView workbookViewId="0"><pane ySplit="8" topLeftCell="A9" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
  <cols>${cols}</cols>
  <sheetData>${rows}</sheetData>
  ${merges}

    function zipStore(files) {
      const encoder = new TextEncoder();
      const chunks = [];
      const central = [];
      let offset = 0;
      Object.entries(files).forEach(([path, content]) => {
        const name = encoder.encode(path);
        const data = encoder.encode(content);
        const crc = crc32(data);
        const local = zipHeader(0x04034b50, name, data.length, crc, offset);
        chunks.push(local, name, data);
        central.push(zipHeader(0x02014b50, name, data.length, crc, offset));
        offset += local.length + name.length + data.length;
      });
      const centralOffset = offset;
      central.forEach((header) => {
        chunks.push(header.bytes, header.name);
        offset += header.bytes.length + header.name.length;
      });
      chunks.push(zipEnd(central.length, offset - centralOffset, centralOffset));
      return new Blob(chunks);
    }

    function zipHeader(signature, name, size, crc, offset) {
      const central = signature === 0x02014b50;
      const bytes = new Uint8Array(central ? 46 : 30);
      const view = new DataView(bytes.buffer);
      view.setUint32(0, signature, true);
      if (central) {
        view.setUint16(4, 20, true); view.setUint16(6, 20, true); view.setUint16(8, 0x0800, true); view.setUint16(10, 0, true);
        view.setUint32(16, crc, true); view.setUint32(20, size, true); view.setUint32(24, size, true); view.setUint16(28, name.length, true); view.setUint32(42, offset, true);
        return { bytes, name };
      }
      view.setUint16(4, 20, true); view.setUint16(6, 0x0800, true); view.setUint16(8, 0, true);
      view.setUint32(14, crc, true); view.setUint32(18, size, true); view.setUint32(22, size, true); view.setUint16(26, name.length, true);
      return bytes;
    }

    function zipEnd(count, centralSize, centralOffset) {
      const bytes = new Uint8Array(22);
      const view = new DataView(bytes.buffer);
      view.setUint32(0, 0x06054b50, true);
      view.setUint16(8, count, true);
      view.setUint16(10, count, true);
      view.setUint32(12, centralSize, true);
      view.setUint32(16, centralOffset, true);
      return bytes;
    }

    function crc32(data) {
      let crc = -1;
      for (let i = 0; i < data.length; i += 1) {
        crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ data[i]) & 0xff];
      }
      return (crc ^ -1) >>> 0;
    }

    const CRC_TABLE = Array.from({ length: 256 }, (_, index) => {
      let crc = index;
      for (let bit = 0; bit < 8; bit += 1) crc = crc & 1 ? 0xedb88320 ^ (crc >>> 1) : crc >>> 1;
      return crc >>> 0;
    });

    function columnName(index) {
      let name = '';
      while (index > 0) {
        index -= 1;
        name = String.fromCharCode(65 + (index % 26)) + name;
        index = Math.floor(index / 26);
      }
      return name;
    }

    function generateCalendarGrid(year, month) {
      const first = new Date(year, month - 1, 1);
      const daysInMonth = new Date(year, month, 0).getDate();
      const mondayFirstOffset = (first.getDay() + 6) % 7;
      const grid = Array(mondayFirstOffset).fill(null);
      for (let day = 1; day <= daysInMonth; day += 1) grid.push(day);
      return grid;
    }

    function monthFromSession(session) {
      const text = String(sessionDisplayDate(session) || '');
      const month = Number(text.split('/')[0]);
      if (Number.isFinite(month) && month > 0) return month;
      const keyMonth = Number(normalizeSessionKey(session.session_key).slice(0, 2));
      return Number.isFinite(keyMonth) && keyMonth > 0 ? keyMonth : 7;
    }

    function sessionDisplayDate(session) {
      const key = normalizeSessionKey(session && session.session_key);
      if (/^\d{4}$/.test(key)) return `${key.slice(0, 2)}/${key.slice(2)}`;

      const text = String((session && session.date) || '');
      const parts = text.split('/');
      if (parts.length >= 2) {
        const month = Number(parts[0]);
        const day = Number(parts[1]);
        if (month > 0 && day > 0) return `${String(month).padStart(2, '0')}/${String(day).padStart(2, '0')}`;
      }
      return text;
    }

    function sessionKeyFromDate(dateText) {
      const parts = String(dateText || '').split('/');
      if (parts.length < 2) return String(dateText || '').replace('/', '');
      return `${String(Number(parts[0])).padStart(2, '0')}${String(Number(parts[1])).padStart(2, '0')}`;
    }

    function normalizeSessionKey(value) {
      const key = String(value ?? '').trim();
      return /^\d{1,3}$/.test(key) ? `000${key}`.slice(-4) : key;
    }

    function legacySessionKey(value) {
      const key = normalizeSessionKey(value);
      return /^\d+$/.test(key) ? String(Number(key)) : key;
    }

    function normalizeStatus(status) {
      return status === 'attend' ? 'attend' : 'absent';
    }

    function statusSurfaceClass(status, compact = false) {
      if (status === 'attend') {
        return compact
          ? 'border-emerald-300 bg-emerald-50 text-emerald-950'
          : 'border-emerald-200 bg-emerald-50';
      }
      return compact
        ? 'border-rose-300 bg-rose-50 text-rose-950'
        : 'border-rose-200 bg-rose-50';
    }

    function api(action, params = {}, options = {}) {
      return new Promise((resolve, reject) => {
        const showOverlay = options.showOverlay !== false;
        if (showOverlay) showLoading();
        const callback = `attendanceCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement('script');
        const query = new URLSearchParams(Object.assign({}, params, { action, callback }));
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error('Apps Script 沒有回應。請確認 Web App 已用「新增版本」重新部署，且存取權限是「任何人」。'));
        }, 12000);

        window[callback] = (payload) => {
          cleanup();
          if (payload.ok) resolve(payload.data);
          else reject(new Error(payload.error || '資料處理失敗。'));
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('無法連線到 Apps Script。請確認 APPS_SCRIPT_URL 是最新 /exec 網址，部署存取權限是「任何人」，執行身分是「我」。'));
        };

        function cleanup() {
          if (showOverlay) hideLoading();
          window.clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        script.src = `${APPS_SCRIPT_URL}?${query.toString()}`;
        document.body.appendChild(script);
      });
    }

    function setLoading(form, loading) {
      form.querySelectorAll('button, input, select').forEach((el) => {
        el.disabled = loading;
        el.classList.toggle('opacity-60', loading);

    function showLoading() {
      const overlay = $('loadingOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

    function hideLoading() {
      const overlay = $('loadingOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function showToast(message, type = 'success') {
      const toast = $('toast');
      toast.textContent = message;
      toast.className = `fixed bottom-4 left-1/2 z-50 max-w-[92vw] -translate-x-1/2 rounded-lg px-4 py-3 text-sm font-bold shadow-lg ${type === 'warning' ? 'bg-amber-400 text-slate-950' : 'bg-slate-950 text-white'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function badgeClass(type) {
      if (type === 'exam') return 'bg-amber-100 text-amber-800';
      if (type === 'event') return 'bg-emerald-100 text-emerald-800';
      if (type === 'national_exam') return 'bg-rose-100 text-rose-800';
      return 'bg-indigo-100 text-indigo-800';
    }

    function typeLabel(type) {
      return {
        tutoring: '課程',
        exam: '模擬考',
        event: '活動',
        national_exam: '國考',
      }[type] || type;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#096;');
    }

    function escapeXml(value) {
      return String(value ?? '').replace(/[<>&'"]/g, (char) => ({
        '<': '&lt;',
        '>': '&gt;',
        '&': '&amp;',
        "'": '&apos;',
        '"': '&quot;',
      }[char]));
    }
  </script>
</body>
</html>
