      { key: "0716", date: "07/16", day: "四", time: "全天班 (09:00-16:00)", subject: "全口活動義齒技術學", teacher: "黃菁芳", type: "tutoring", classroom: "C205 正課教室", notes: "" },

      { key: "0723", date: "07/23", day: "四", time: "AM 考前事項宣達* / PM 祈福活動", subject: "考前重要宣達事項 & 祈福大會", teacher: "班級導師 / 系主任", type: "event", classroom: "C205 / 祈福會場", notes: "祈福大會備有包子與粽子，預祝大家金榜題名！" },
      { key: "0725", date: "07/25", day: "六", time: "出發日 / 看考場", subject: "北上國考 (交通與考場巡禮)", teacher: "帶隊老師", type: "national_exam", classroom: "北部試區", notes: "遊覽車將於上午 08:30 於校門口準時發車，請勿遲到。" },
      { key: "0726", date: "07/26", day: "日", time: "正式考試 (第一天)", subject: "牙體技術師國家考試 - 學科與術科", teacher: "考選部", type: "national_exam", classroom: "考選部指定試場", notes: "記得攜帶身分證、准考證及規定文具器械。" },
      { key: "0727", date: "07/27", day: "一", time: "正式考試 (第二天)", subject: "牙體技術師國家考試 - 學科與術科", teacher: "考選部", type: "national_exam", classroom: "考選部指定試場", notes: "" },
      { key: "0728", date: "07/28", day: "二", time: "考後處理與討論", subject: "返校疑議處理", teacher: "系上專業團隊", type: "national_exam", classroom: "系辦公室", notes: "對試題答案有疑慮者，請攜帶佐證資料到系辦公室填寫疑議表。" }
    ];

    // 初始化模擬學生名單 (含密碼欄位)
    const INITIAL_STUDENTS = [
      { id: "115001", name: "張育誠", password: "115", year: "115級 (2026)", type: "在職專班", attendance: { "0630": "attend", "0701": "tentative", "0702": "absent", "0703": "attend", "0704": "attend", "0705": "attend" } },
      { id: "115002", name: "陳映婕", password: "115", year: "115級 (2026)", type: "五專部", attendance: { "0630": "attend", "0701": "attend", "0702": "attend", "0703": "attend", "0704": "attend", "0705": "attend" } },
      { id: "115003", name: "林楷瀚", password: "115", year: "115級 (2026)", type: "在職專班", attendance: { "0630": "tentative", "0701": "attend", "0702": "absent", "0703": "tentative", "0704": "absent", "0705": "attend" } },
      { id: "115004", name: "黃歆雅", password: "115", year: "115級 (2026)", type: "五專部", attendance: { "0630": "attend", "0701": "attend", "0702": "attend", "0703": "absent", "0704": "attend", "0705": "attend" } },
      { id: "115005", name: "徐志傑", password: "115", year: "115級 (2026)", type: "在職專班", attendance: { "0630": "absent", "0701": "tentative", "0702": "attend", "0703": "attend", "0704": "tentative", "0705": "attend" } }
    ];

    function App() {
      // 讀取本地快取或使用預設值
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('dental_exam_sprint_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem('dental_exam_sprint_sessions');
        return saved ? JSON.parse(saved) : DENTAL_SESSIONS;
      });

      // UI 提示與彈窗狀態
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const [confirmModal, setConfirmModal] = useState({ show: false, message: '', onConfirm: null });

      // 頁籤控制：'student' 或是 'admin'
      const [activeTab, setActiveTab] = useState('student');

      // 權限控管狀態
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [studentPasswordInput, setStudentPasswordInput] = useState('');

      // 課表類型過濾器
      const [filterType, setFilterType] = useState('all');

      // 搜尋學生關鍵字與選中學生
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStudent, setSelectedStudent] = useState(null);

      // 新生報名表單狀態
      const [newStudent, setNewStudent] = useState({ id: '', name: '', password: '', year: '115級 (2026)', type: '在職專班' });
      const [showRegisterForm, setShowRegisterForm] = useState(false);

      // 新增課程區塊顯示控制
      const [newSession, setNewSession] = useState({ date: '', day: '六', time: '', subject: '', teacher: '', type: 'tutoring', classroom: 'C205 正課教室', notes: '' });
      const [showAddSession, setShowAddSession] = useState(false);

      // 備份還原文字區
      const [showBackup, setShowBackup] = useState(false);
      const [backupText, setBackupText] = useState('');

      // 學生端視圖模式切換：'calendar'（日曆確認） 或是 'list'（清單快速勾選）
      const [studentViewMode, setStudentViewMode] = useState('calendar');
      const [calendarMonth, setCalendarMonth] = useState(7); // 預設顯示 7 月（課表主體）
      const [selectedCalendarDate, setSelectedCalendarDate] = useState("0701"); // 日曆點選的日期 key

      // 管理者深入控制：某特定日期的出席名單與注意事項編輯器
      const [activeAdminSession, setActiveAdminSession] = useState(null);
      const [sessionNotesInput, setSessionNotesInput] = useState('');

      // 同步到 LocalStorage
      useEffect(() => {
        localStorage.setItem('dental_exam_sprint_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('dental_exam_sprint_sessions', JSON.stringify(sessions));
      }, [sessions]);

      // 自訂輕量化 Toast 訊息發佈器
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => {
          setToast(prev => ({ ...prev, show: false }));
        }, 3500);
      };

      // 處理學生搜尋並驗證密碼
      const handleSearch = (e) => {
        e.preventDefault();
        const found = students.find(
          s => s.name.trim() === searchQuery.trim() || s.id.trim() === searchQuery.trim()
        );
        if (found) {
          const correctPassword = found.password || "115";
          if (studentPasswordInput === correctPassword) {
            setSelectedStudent(found);
            showToast(`登入成功！哈囉 ${found.name} 同學。`);
          } else {
            showToast("密碼不正確！請向幹部核對或重設密碼。", "warning");
          }
        } else {
          showToast("找不到該名同學！如果是首次登記，請點選下方『新同學首次登記』。", "warning");
          setSelectedStudent(null);
        }
      };

      // 管理員登入認證
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasswordInput === 'admin115') {
          setIsAdminAuthenticated(true);
          showToast("管理權限驗證成功，歡迎回到總務後台！");
        } else {
          showToast("管理密碼錯誤！請重新輸入（預設為 admin115）", "warning");
        }
      };

      // 管理員登出
      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        setAdminPasswordInput('');
        setActiveTab('student');
        showToast("已安全登出管理系統。");
      };

      // 學生/管理員自主變更出席狀態
      const updateAttendance = (studentId, sessionKey, status) => {
        setStudents(prev => prev.map(student => {
          if (student.id === studentId) {
            return {
              ...student,
              attendance: {
                ...student.attendance,
                [sessionKey]: status
              }
            };
          }
          return student;
        }));
        
        // 即時同步更新當前選取學生的狀態
        if (selectedStudent && selectedStudent.id === studentId) {
          setSelectedStudent(prev => ({
            ...prev,
            attendance: {
              ...prev.attendance,
              [sessionKey]: status
            }
          }));
        }
        showToast("出席狀態已即時更新並儲存！");
      };

      // 註冊新同學
      const handleRegister = (e) => {
        e.preventDefault();
        if (!newStudent.id || !newStudent.name) {
          showToast("學號與姓名皆為必填項目！", "warning");
          return;
        }

        if (students.some(s => s.id === newStudent.id)) {
          showToast("此學號已被註冊過！請直接在上方搜尋您的姓名或學號。", "warning");
          return;
        }

        const passToSet = newStudent.password || "115";

        const newEntry = {
          ...newStudent,
          password: passToSet,
          attendance: sessions.reduce((acc, curr) => ({ ...acc, [curr.key]: 'absent' }), {})
        };

        setStudents(prev => [...prev, newEntry]);
        setSelectedStudent(newEntry);
        setSearchQuery(newEntry.name);
        setStudentPasswordInput(passToSet);
        showToast(`登記成功！歡迎 ${newEntry.name} 同學。`);
        setShowRegisterForm(false);
        setNewStudent({ id: '', name: '', password: '', year: '115級 (2026)', type: '在職專班' });
      };

      // 管理員手動新增堂數
      const handleAddSession = (e) => {
        e.preventDefault();
        if (!newSession.date || !newSession.subject) {
          showToast("日期與科目為必填！", "warning");
          return;
        }
        const key = newSession.date.replace("/", "");
        const newObj = {
          key,
          ...newSession
        };
        setSessions(prev => [...prev, newObj]);
        showToast(`成功新增一堂行程：${newSession.subject}`);
        setShowAddSession(false);
        setNewSession({ date: '', day: '六', time: '', subject: '', teacher: '', type: 'tutoring', classroom: 'C205 正課教室', notes: '' });
      };

      // 管理員存取/更新課程注意事項
      const handleSaveNotes = () => {
        if (!activeAdminSession) return;
        setSessions(prev => prev.map(s => {
          if (s.key === activeAdminSession.key) {
            return { ...s, notes: sessionNotesInput };
          }
          return s;
        }));
        // 即時更新當下預覽的 Session 物件
        setActiveAdminSession(prev => ({ ...prev, notes: sessionNotesInput }));
        showToast(`成功更新 ${activeAdminSession.date} 的幹部注意事項，學生端已即時同步！`);
      };

      // 複製出席情況至 LINE 群組
      const copyToClipboard = (session) => {
        const attendees = students.filter(st => st.attendance[session.key] === 'attend');
        const tentatives = students.filter(st => st.attendance[session.key] === 'tentative');
        const absentees = students.filter(st => st.attendance[session.key] === 'absent' || !st.attendance[session.key]);

        const text = `【115牙技國考衝刺 📢 出席回報】
📅 日期：${session.date} (${session.day}) ${session.time}
📚 講題/行程：${session.subject}
📍 教室：${session.classroom}
👨‍🏫 講師/負責：${session.teacher}
⚠️ 注意事項：${session.notes || '無特別宣達'}
--------------------------
🟢 確定出席 (${attendees.length}人)：
${attendees.map(s => `${s.name}(${s.type === '在職專班' ? '在職' : '五專'})`).join('、') || '暫無'}

🟡 臨時待定 (${tentatives.length}人，前一天確認)：
${tentatives.map(s => s.name).join('、') || '暫無'}

🔴 無法出席 (${absentees.length}人)：
${absentees.map(s => s.name).join('、') || '暫無'}

💡 在職專班同學若工作或值班有臨時異動，隨時點擊網頁更新即可，統計名冊將自動重整！`;

        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        showToast(`🎉 已複製『${session.date}』的 LINE 通報文字！`);
      };

      // 匯出 CSV 報表
      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "學號,姓名,畢業年份,學籍班別,個人登入密碼," + sessions.map(s => `${s.date}(${s.subject})`).join(",") + "\n";
        
        students.forEach(st => {
          const row = [
            st.id,
            st.name,
            st.year,
            st.type,
            st.password || "115",
            sessions.map(s => {
              const status = st.attendance[s.key];
              if (status === 'attend') return "出席";
              if (status === 'tentative') return "待定";
              return "不出席";
            }).join(",")
          ];
          csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `115牙技國考衝刺班出席名單_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("CSV 報表導出完成！");
      };

      const exportBackup = () => {
        const dataStr = JSON.stringify({ students, sessions }, null, 2);
        setBackupText(dataStr);
        setShowBackup(true);
        showToast("備份資料已產生！");
      };

      const importBackup = () => {
        try {
          const parsed = JSON.parse(backupText);
          if (parsed.students && parsed.sessions) {
            setStudents(parsed.students);
            setSessions(parsed.sessions);
            showToast("資料還原成功！");
            setShowBackup(false);
          } else {

                        </form>
                      )}
                    </div>

                    {/* 第二區：每堂行程出席統計、名單透視與 LINE 一鍵複製 */}
                    {}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {sessions.map(session => {
                        const attendees = students.filter(st => st.attendance[session.key] === 'attend').length;
                        const tentatives = students.filter(st => st.attendance[session.key] === 'tentative').length;
                        const absentees = students.filter(st => !st.attendance[session.key] || st.attendance[session.key] === 'absent').length;
                        const totalResponse = attendees + tentatives + absentees;
                        const attendanceRate = totalResponse > 0 ? Math.round((attendees / students.length) * 100) : 0;
                        const bData = getSessionBadge(session.type);

                        return (
                          <div key={session.key} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition-all">
                            <div>
                              <div className="flex justify-between items-start">
                                <span className="bg-indigo-50 text-indigo-700 font-bold text-xs px-2 py-0.5 rounded border border-indigo-100">
                                  {session.date} ({session.day})
                                </span>
                                <span className={`text-[9px] px-2 py-0.5 rounded font-bold border ${bData.style}`}>
                                  {bData.label}
                                </span>
                              </div>
                              
                              <h4 className="text-base font-bold text-slate-800 mt-2.5 line-clamp-1">{session.subject}</h4>
                              <div className="text-slate-400 text-xs block mb-3 mt-1 space-y-0.5">
                                <div>主講/監考：<strong className="text-slate-700 font-semibold">{session.teacher}</strong></div>
                                <div className="text-[11px] text-indigo-600 font-medium"><i className="fa-solid fa-location-dot mr-1"></i>{session.classroom}</div>
                              </div>

                              {/* 備忘備註簡述 */}
                              {session.notes && (
                                <div className="bg-slate-50 border border-slate-100 rounded-lg p-2 mb-3 text-[11px] text-slate-600 line-clamp-1 italic">
                                  📌 {session.notes}
                                </div>
                              )}

                              {/* 視覺統計條 */}
                              <div className="space-y-2 mb-4">
                                <div className="flex justify-between text-xs font-semibold text-slate-500">
                                  <span>預估出席率</span>
                                  <span>{attendanceRate}%</span>
                                </div>
                                <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden flex">
                                  <div className="bg-emerald-500 h-full" style={{ width: `${(attendees / students.length) * 100}%` }}></div>
                                  <div className="bg-amber-400 h-full" style={{ width: `${(tentatives / students.length) * 100}%` }}></div>
                                  <div className="bg-rose-300 h-full" style={{ width: `${(absentees / students.length) * 100}%` }}></div>
                                </div>
                                <div className="flex justify-between text-[11px] text-slate-500 font-medium">
                                  <span>出席: <strong className="text-emerald-600">{attendees}</strong></span>
                                  <span>待定: <strong className="text-amber-600">{tentatives}</strong></span>
                                  <span>未到: <strong className="text-rose-500">{absentees}</strong></span>
                                </div>
                              </div>
                            </div>

                            <div className="space-y-2 pt-2 border-t border-slate-100">
                              <button 
                                onClick={() => {
                                  setActiveAdminSession(session);
                                  setSessionNotesInput(session.notes || '');
                                }}
                                className="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-800 text-xs font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-colors border border-indigo-200"
                              >
                                <i className="fa-solid fa-clipboard-list text-sm"></i> 🔍 名單與注意事項
                              </button>
                              <button 
                                onClick={() => copyToClipboard(session)}
                                className="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1.5 transition-colors border border-emerald-200"
                              >
                                <i className="fa-brands fa-line text-sm"></i> 複製 LINE 群組通報
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* ==================== 課程出缺席名單與注意事項 Modal ==================== */}
                    {}
                    {activeAdminSession && (
                      <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                        <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl border border-slate-100 flex flex-col transform transition-all animate-fade-in">
                          {/* Modal Header */}
                          <div className="bg-slate-900 text-white p-5 flex justify-between items-center shrink-0">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="bg-indigo-600 text-white text-xs font-bold px-2.5 py-0.5 rounded">
                                  {activeAdminSession.date} ({activeAdminSession.day})
                                </span>
                                <span className="text-xs text-slate-300">{activeAdminSession.time}</span>
                              </div>
                              <h4 className="text-lg font-bold mt-1 text-amber-400">{activeAdminSession.subject}</h4>
                            </div>
                            <button 
                              onClick={() => setActiveAdminSession(null)}
                              className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-white transition-colors"
                            >
                              <i className="fa-solid fa-xmark"></i>
                            </button>
                          </div>

                          {/* Modal Content Body */}
                          <div className="p-6 overflow-y-auto space-y-6 flex-1 bg-slate-50">
                            
                            {/* 注意事項填寫區 */}
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                              <h5 className="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <i className="fa-solid fa-pen-to-square text-indigo-500"></i> 本堂課程注意事項 / 備忘錄公告
                              </h5>
                              <p className="text-xs text-slate-500">學生登入系統後，不論在行曆或清單中，皆可同步看見此注意事項（例如：工具攜帶提醒、考試大綱說明）。</p>
                              <textarea
                                rows="3"
                                value={sessionNotesInput}
                                onChange={(e) => setSessionNotesInput(e.target.value)}
                                placeholder="請在此輸入對應的注意事項... 例如：明天全口排列請帶排牙專用蠟與手動器械，當天早上需提前15分鐘排好石膏模型。"
                                className="w-full text-sm p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-slate-800 placeholder-slate-400 font-medium transition-all"
                              />
                              <div className="flex justify-end">
                                <button 
                                  onClick={handleSaveNotes}
                                  className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition-colors shadow-md shadow-indigo-100 flex items-center gap-1.5"
                                >
                                  <i className="fa-solid fa-floppy-disk"></i> 儲存注意事項
                                </button>
                              </div>
                            </div>

                            {/* 今日出席同學名單與未登記名單 */}
                            <div className="space-y-3">
                              <h5 className="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <i className="fa-solid fa-users text-indigo-500"></i> 今日出缺席同學詳細名單
                              </h5>
                              
                              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                {/* 確定出席 */}
                                <div className="bg-white p-4 rounded-xl border border-emerald-100 shadow-sm flex flex-col min-h-[250px]">
                                  <div className="text-emerald-800 font-bold text-xs pb-2 border-b border-emerald-50 mb-3 flex items-center justify-between">
                                    <span className="flex items-center gap-1.5">
                                      <span className="w-2 h-2 bg-emerald-500 rounded-full"></span> 🟢 確定出席
                                    </span>
                                    <span className="bg-emerald-50 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">
                                      {students.filter(st => st.attendance[activeAdminSession.key] === 'attend').length} 人
                                    </span>
                                  </div>
                                  <div className="space-y-2 overflow-y-auto max-h-[200px] flex-1 pr-1">
                                    {students.filter(st => st.attendance[activeAdminSession.key] === 'attend').length === 0 ? (
                                      <div className="text-slate-400 text-xs text-center py-8">目前暫無同學登記</div>
                                    ) : (
                                      students.filter(st => st.attendance[activeAdminSession.key] === 'attend').map(st => (
                                        <div key={st.id} className="bg-emerald-50/50 p-2 rounded-lg border border-emerald-100/50 flex items-center justify-between">
                                          <span className="text-xs font-bold text-slate-800">{st.name}</span>
                                          <span className="text-[9px] bg-white text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded font-semibold">
                                            {st.type === '在職專班' ? '在職' : '五專'}
                                          </span>
                                        </div>
                                      ))
                                    )}
                                  </div>
                                </div>

                                {/* 臨時待定 */}
                                <div className="bg-white p-4 rounded-xl border border-amber-100 shadow-sm flex flex-col min-h-[250px]">
                                  <div className="text-amber-800 font-bold text-xs pb-2 border-b border-amber-50 mb-3 flex items-center justify-between">
                                    <span className="flex items-center gap-1.5">
                                      <span className="w-2 h-2 bg-amber-400 rounded-full"></span> 🟡 臨時待定
                                    </span>
                                    <span className="bg-amber-50 text-amber-800 px-2 py-0.5 rounded text-[10px] font-bold">
                                      {students.filter(st => st.attendance[activeAdminSession.key] === 'tentative').length} 人
                                    </span>
                                  </div>
                                  <div className="space-y-2 overflow-y-auto max-h-[200px] flex-1 pr-1">
                                    {students.filter(st => st.attendance[activeAdminSession.key] === 'tentative').length === 0 ? (
                                      <div className="text-slate-400 text-xs text-center py-8">目前暫無同學登記</div>
                                    ) : (
                                      students.filter(st => st.attendance[activeAdminSession.key] === 'tentative').map(st => (
                                        <div key={st.id} className="bg-amber-50/50 p-2 rounded-lg border border-amber-100/50 flex items-center justify-between">
                                          <span className="text-xs font-bold text-slate-800">{st.name}</span>
                                          <span className="text-[9px] bg-white text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded font-semibold">
                                            {st.type === '在職專班' ? '在職' : '五專'}
                                          </span>
                                        </div>
                                      ))
                                    )}
                                  </div>
                                </div>

                                {/* 無法出席 / 未選 */}
                                <div className="bg-white p-4 rounded-xl border border-rose-100 shadow-sm flex flex-col min-h-[250px]">
                                  <div className="text-rose-800 font-bold text-xs pb-2 border-b border-rose-50 mb-3 flex items-center justify-between">
                                    <span className="flex items-center gap-1.5">
                                      <span className="w-2 h-2 bg-rose-500 rounded-full"></span> 🔴 無法出席 / 未選
                                    </span>
                                    <span className="bg-rose-50 text-rose-800 px-2 py-0.5 rounded text-[10px] font-bold">
                                      {students.filter(st => !st.attendance[activeAdminSession.key] || st.attendance[activeAdminSession.key] === 'absent').length} 人
                                    </span>
                                  </div>
                                  <div className="space-y-2 overflow-y-auto max-h-[200px] flex-1 pr-1">
                                    {students.filter(st => !st.attendance[activeAdminSession.key] || st.attendance[activeAdminSession.key] === 'absent').length === 0 ? (
                                      <div className="text-slate-400 text-xs text-center py-8">目前全體皆已登記出席或待定</div>
                                    ) : (
                                      students.filter(st => !st.attendance[activeAdminSession.key] || st.attendance[activeAdminSession.key] === 'absent').map(st => (
                                        <div key={st.id} className="bg-rose-50/50 p-2 rounded-lg border border-rose-100/50 flex items-center justify-between">
                                          <span className="text-xs font-bold text-slate-800">{st.name}</span>
                                          <span className="text-[9px] bg-white text-rose-700 border border-rose-200 px-1.5 py-0.5 rounded font-semibold">
                                            {st.type === '在職專班' ? '在職' : '五專'}
                                          </span>
                                        </div>
                                      ))
                                    )}
                                  </div>
                                </div>
                              </div>
                            </div>

                          </div>
                          
                          {/* Footer */}
                          <div className="bg-slate-100 p-4 border-t border-slate-200 flex justify-end shrink-0">
                            <button 
                              onClick={() => setActiveAdminSession(null)}
                              className="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition-colors"
                            >
                              關閉視窗
                            </button>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* 第三區：完整大名冊 (管理員可直接在此幫同學更動修改密碼，已固定前三列) */}
                    {}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                      <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                          <h4 className="text-lg font-bold text-slate-800">115 衝刺班全體學籍動態名冊</h4>
                          <p className="text-slate-400 text-xs mt-0.5">💡 提示：最左側基本欄位已凍結。管理員可以直接在【修改密碼】輸入框打字幫同學更新密碼，系統即時存檔！</p>
                        </div>
                        <div className="text-xs bg-slate-50 p-2.5 rounded-lg border border-slate-100 flex flex-wrap items-center gap-4">
                          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 bg-emerald-500 rounded-full"></span> 確定出席</span>
                          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 bg-amber-400 rounded-full"></span> 臨時待定</span>
                          <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 bg-rose-400 rounded-full"></span> 無法出席</span>
                        </div>
                      </div>

                      {/* 橫向捲動容器 */}
                      <div className="overflow-x-auto relative">
                        <table className="w-full text-sm text-left text-slate-700 min-w-[1200px] border-collapse">
                          <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                            <tr>
                              <th className="sticky left-0 z-30 bg-slate-100 border-b border-slate-200 px-4 py-4 font-bold min-w-[90px] w-[90px] text-slate-700">學號</th>
                              <th className="sticky left-[90px] z-30 bg-slate-100 border-b border-slate-200 px-4 py-4 font-bold min-w-[95px] w-[95px] text-slate-700">姓名</th>
                              <th className="sticky left-[185px] z-30 bg-slate-100 border-b border-slate-200 px-4 py-4 font-bold min-w-[105px] w-[105px] text-slate-700 border-r border-slate-200 shadow-[4px_0_8px_-4px_rgba(0,0,0,0.15)]">學籍班別</th>
                              
                              <th className="px-4 py-4 font-bold text-center text-indigo-700 min-w-[120px]">修改密碼 (雙擊/點擊打字)</th>
                              {sessions.map(s => (
                                <th key={s.key} className="px-3 py-4 text-center font-bold min-w-[75px] border-b border-slate-200">
                                  <div className="text-slate-700 text-xs">{s.date}</div>
                                  <div className="text-[9px] text-slate-400 font-medium truncate max-w-[70px] mx-auto" title={s.subject}>{s.subject}</div>
                                </th>
                              ))}
                              <th className="px-5 py-4 text-center font-bold min-w-[80px]">資料管理</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {students.map(student => (
                              <tr key={student.id} className="group hover:bg-slate-50/70 transition-colors">
                                <td className="sticky left-0 z-10 bg-white group-hover:bg-slate-50 px-4 py-4 font-mono font-medium text-slate-500 min-w-[90px] w-[90px] transition-colors">
                                  {student.id}
                                </td>
                                <td className="sticky left-[90px] z-10 bg-white group-hover:bg-slate-50 px-4 py-4 font-bold text-slate-800 min-w-[95px] w-[95px] transition-colors">
                                  {student.name}
                                </td>
                                <td className="sticky left-[185px] z-10 bg-white group-hover:bg-slate-50 px-4 py-4 min-w-[105px] w-[105px] transition-colors border-r border-slate-200 shadow-[4px_0_8px_-4px_rgba(0,0,0,0.15)]">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${student.type === '在職專班' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-indigo-50 text-indigo-700 border border-indigo-200'}`}>
                                    {student.type}
                                  </span>
                                </td>
                                
                                {/* 可直接由管理員編輯更改的行內密碼欄位 */}
                                <td className="px-4 py-4 text-center bg-indigo-50/20">
                                  <input 
                                    type="text" 
                                    value={student.password || "115"}
                                    onChange={(e) => {
                                      const newPass = e.target.value;
                                      setStudents(prev => prev.map(s => s.id === student.id ? { ...s, password: newPass } : s));
                                      if (selectedStudent && selectedStudent.id === student.id) {
                                        setSelectedStudent(prev => ({ ...prev, password: newPass }));
                                      }
                                    }}
                                    className="w-24 px-2 py-1 text-xs text-center font-mono font-bold border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-800 hover:border-slate-300 transition-all"
                                    title="管理員可在此直接打字修改此同學的密碼"
                                  />
                                </td>

                                {sessions.map(s => {
                                  const att = student.attendance[s.key] || 'absent';
                                  
                                  const toggleStatus = () => {
                                    const nextMap = { 'attend': 'tentative', 'tentative': 'absent', 'absent': 'attend' };
                                    updateAttendance(student.id, s.key, nextMap[att]);
                                  };

                                  return (
                                    <td key={s.key} className="px-2 py-4 text-center">
                                      <button 
                                        onClick={toggleStatus}
                                        className={`w-8 h-8 rounded-full flex items-center justify-center mx-auto transition-all hover:scale-110 ${
                                          att === 'attend' ? 'bg-emerald-500 text-white shadow-sm' :
                                          att === 'tentative' ? 'bg-amber-400 text-slate-900 shadow-sm' :
                                          'bg-slate-100 text-slate-400 hover:bg-slate-200'
                                        }`}
                                      >
                                        {att === 'attend' && <i className="fa-solid fa-check text-[11px]"></i>}
                                        {att === 'tentative' && <i className="fa-solid fa-question text-[11px]"></i>}
                                        {att === 'absent' && <i className="fa-solid fa-times text-[11px]"></i>}
                                      </button>
                                    </td>
                                  );
                                })}
                                <td className="px-5 py-4 text-center">
                                  <button 
                                    onClick={() => {
                                      setConfirmModal({
                                        show: true,
                                        message: `確定要將「${student.name}」同學從國考衝刺名單中刪除嗎？`,
                                        onConfirm: () => {
                                          setStudents(prev => prev.filter(s => s.id !== student.id));
                                          showToast(`已移除 ${student.name} 同學的報名紀錄。`);
                                        }
                                      });
                                    }}
                                    className="text-rose-600 hover:text-rose-800 font-semibold text-xs flex items-center gap-1 justify-center transition-colors mx-auto"
                                  >
                                    <i className="fa-solid fa-trash-can"></i> 刪除
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
